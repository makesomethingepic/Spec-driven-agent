name: metrics
on:
  schedule:
    - cron: "0 5 * * *" # nightly
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/metrics.py > metrics.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json
