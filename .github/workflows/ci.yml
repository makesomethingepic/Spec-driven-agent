name: ci
on:
  pull_request:
  push:
    branches: [main, "release/**"]
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/validate_state.py
  trace-ids:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title carries a trace ID
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '(IDEA|REQ|AC|NFR|STORY|ADR|CR|BUG|ESC)-[0-9]{3}|(EPIC|FEAT)-[0-9]{2}' \
            || { echo "PR title needs a trace ID, e.g. 'FEAT-01 STORY-004: ...'"; exit 1; }
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO per product: set up the runtime, then run unit, integration, e2e,
      # accessibility and performance tests. Any failure must fail this job.
      - run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile; then make test
          else echo "::warning::No test target yet. Add 'make test' or replace this step."; fi
